<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Produk - Kopi Nusa</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="site-header">
  <a class="brand" href="index.html">Kopi Nusa</a>
  <nav aria-label="Navigasi utama">
    <a href="index.html">Beranda</a>
    <a href="tentang.html">Tentang Kami</a>
    <a href="produk.html">Produk</a>
    <a href="galeri.html">Galeri</a>
    <a href="index.html#profil">Profil</a>
    <a href="index.html#kontak-singkat">Kontak Singkat</a>
    <a href="kontak.html">Kontak</a>
  </nav>
</header>

<main class="page">
  <section aria-labelledby="produk-title">
    <h1 id="produk-title">Produk Kopi Nusa</h1>

    <figure>
      <img src="kopi.jpeg" alt="Secangkir kopi Kopi Nusa">
      <figcaption>
        Kopi lokal pilihan untuk menemani aktivitas sehari-hari.
      </figcaption>
    </figure>

    <h2>Produk Unggulan</h2>
    <p>Pilih tampilan katalog yang ingin kamu lihat.</p>

    <div class="layout-demo">
      <div class="toolbar-actions" role="group" aria-label="Pilihan layout katalog">
        <button type="button" data-layout="grid">Grid</button>
        <button type="button" data-layout="flex">Flexbox</button>
      </div>

      <p id="layoutStatus" class="layout-status" role="status">
        Mode aktif: Grid dua dimensi
      </p>

      <div id="catalog" class="catalog layout-grid"
           aria-label="Katalog produk kopi">
        <div id="produk-dinamis"></div>
      </div>

    </div>
  </section>
</main>

<footer class="site-footer">
  <p>Hubungi Kopi Nusa melalui WhatsApp: 0812-0000-0000</p>
</footer>

<script src="js/app.js" defer></script>
</body>
</html>
