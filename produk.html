
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Produk - LUNARIA Coffee</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="site-header">
  <a class="brand" href="index.html">LUNARIA Coffee</a>

  <button
    class="menu-toggle"
    type="button"
    aria-label="Buka menu navigasi"
    aria-expanded="false"
    aria-controls="nav-menu"
  >
    ☰
  </button>

  <nav id="nav-menu" aria-label="Navigasi utama">
    <a href="index.html">Beranda</a>
    <a href="tentang.html">Tentang Kami</a>
    <a href="produk.html">Produk</a>
    <a href="galeri.html">Galeri</a>
    <a href="index.html#profil">Profil</a>
    <a href="index.html#kontak-singkat">Kontak Singkat</a>
    <a href="kontak.html">Kontak</a>
  </nav>
</header>

<main class="page">
  <section aria-labelledby="produk-title">
    <h1 id="produk-title">Produk LUNARIA Coffee</h1>

    <figure>
      <img src="kopi.jpeg" alt="Secangkir kopi LUNARIA Coffee">
      <figcaption>
        Kopi lokal pilihan untuk menemani aktivitas sehari-hari.
      </figcaption>
    </figure>

    <h2>Produk Unggulan</h2>
    <p>Pilih kategori produk yang ingin kamu lihat.</p>

    <div class="filter-container" role="group" aria-label="Filter kategori produk">
      <button type="button" class="filter-button is-active" data-filter="Semua">
        Semua
      </button>
      <button type="button" class="filter-button" data-filter="Minuman">
        Minuman
      </button>
      <button type="button" class="filter-button" data-filter="Makanan">
        Makanan
      </button>
      <button type="button" class="filter-button" data-filter="Kopi">
        Kopi
      </button>
    </div>

    <p id="produk-ringkasan" aria-live="polite"></p>
    <div id="produk-unggulan"></div>

    <div class="layout-demo">
      <div class="toolbar-actions" role="group" aria-label="Pilihan layout katalog">
        <button type="button" data-layout="grid">Grid</button>
        <button type="button" data-layout="flex">Flexbox</button>
      </div>

      <p id="layoutStatus" class="layout-status" role="status">
        Mode aktif: Grid dua dimensi
      </p>

      <div id="catalog" class="catalog layout-grid"
           aria-label="Katalog produk kopi">
        <div id="produk-dinamis"></div>
      </div>
    </div>
  </section>
</main>

<footer class="site-footer">
  <p>Hubungi LUNARIA Coffee melalui WhatsApp: 0812-0000-0000</p>
</footer>

<script src="js/app.js" defer></script>
</body>
</html>
